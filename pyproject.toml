[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xcrap-sdk"
version = "1.3.0"
description = "Official Python client for XCrap — X/Twitter posts, threads, profiles, timelines and media as JSON or LLM-ready markdown. No API key."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "XCrap", email = "hello@xcrap.cc" }]
keywords = ["xcrap", "twitter", "x", "scraper", "api", "markdown", "llm", "sdk"]
dependencies = ["httpx>=0.24"]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://xcrap.cc"
Documentation = "https://xcrap.cc/docs"
Source = "https://github.com/XcrapCC/xcrap-python"
Issues = "https://github.com/XcrapCC/xcrap-python/issues"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.21"]

[tool.hatch.build.targets.wheel]
packages = ["xcrap"]

[tool.hatch.build.targets.sdist]
include = ["xcrap", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
